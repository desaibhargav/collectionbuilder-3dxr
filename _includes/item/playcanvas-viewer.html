{% comment %}
    Public derivatives only. relative_url supports both repository subpaths
    and externally hosted HTTPS objects. Never insert preservation-master URLs.
{% endcomment %}
{% assign viewer_item = include.item | default: page %}
<div class="cb-viewer" data-3dxr-viewer
    {% if include.embedded %}data-3dxr-embedded{% else %}data-3dxr-fit{% endif %}
    data-objectid="{{ viewer_item.objectid | escape }}"
    data-title="{{ viewer_item.title | escape }}"
    data-description="{{ viewer_item.description | escape }}"
    data-viewer-type="{{ viewer_item.viewer_type | default: viewer_item.display_template | escape }}"
    data-content="{{ viewer_item.object_location | relative_url | escape }}"
    {% if viewer_item.viewer_lod %}data-lod="{{ viewer_item.viewer_lod | relative_url | escape }}"{% endif %}>
    <p role="status">Loading 3D viewer…</p>
</div>
<noscript><p>The interactive 3D viewer requires JavaScript. Object metadata remains available below.</p></noscript>
